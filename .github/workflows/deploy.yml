# Deploys to Cloud Run: main to production, staging to the staging stack
# (onboardai-*-staging in the same project). CI runs first on the same commit;
# nothing is pushed or deployed unless every CI job passes. After the images
# are pushed, the migration job applies the commit's pending Cloud SQL and
# Firestore migrations (#45); only if it succeeds are tts, then api, then web
# deployed. On staging only, and only once its code is in the commit, the
# intake agent is deployed to Vertex AI Agent Engine (#27, #30). The onboarding
# checklist agent (#51) is deployed the same way, on staging and, once
# CHECKLIST_AGENT_ENABLED is true, on production. One-time setup, staging and
# rollback: terraform/onboardai/README.md.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per environment at a time, never cancelled halfway. Pushes that
# arrive during a deploy wait; if several wait, GitHub keeps only the newest.
# Production and staging never wait for each other. A manual run on any other
# branch deploys nothing (ci and config skip it) and gets a group of its own, so
# it never displaces a waiting deploy.
concurrency:
  group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || format('none-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Vertex AI location the API uses for Gemini (GOOGLE_CLOUD_LOCATION). The
  # model is served on "global"; regional endpoints such as asia-southeast1 do not have it.
  VERTEX_LOCATION: global
  # The stack this run deploys: main -> production, staging -> staging (the only
  # two refs that get past ci and config). NAME_SUFFIX is appended to every
  # staging resource ID, as local.name_suffix in terraform/onboardai.
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
  NAME_SUFFIX: ${{ github.ref == 'refs/heads/staging' && '-staging' || '' }}
  # Agent Engine region of the employee form intake agent (staging only, #30)
  # and of the onboarding checklist agent (#51). Must equal
  # var.intake_agent_location of terraform/onboardai (terraform test checks
  # it). The agents call Gemini on VERTEX_LOCATION.
  INTAKE_AGENT_LOCATION: asia-southeast1

jobs:
  ci:
    name: CI
    # Workload Identity Federation trusts refs/heads/main (production provider)
    # and refs/heads/staging (staging provider) only; skip other refs early.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/ci.yml
    with:
      # Build all three images in CI, whatever the commit changed.
      run-all: true
    permissions:
      contents: read

  config:
    name: Check repository variables
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    # Every job that reads vars.* names the GitHub environment of its stack:
    # vars.* resolve from that environment first, then from the repository.
    # production defines no environment variables, so it reads the repository
    # variables as before; staging holds its own nine. The environment changes
    # the OIDC token's sub claim, which neither WIF provider reads.
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
      AI_MODE: ${{ vars.AI_MODE }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      VERTEX_SEARCH_LOCATION: ${{ vars.VERTEX_SEARCH_LOCATION }}
      VERTEX_SEARCH_ENGINE_ID: ${{ vars.VERTEX_SEARCH_ENGINE_ID }}
      FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
      # Optional (#51, #52): unset means the default after ||, and an empty
      # GEMINI_TTS_VOICE means the backend's default voice.
      VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER || 'gemini' }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
      GEMINI_TTS_LOCATION: ${{ vars.GEMINI_TTS_LOCATION || 'global' }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
      CHECKLIST_AGENT_ENABLED: ${{ vars.CHECKLIST_AGENT_ENABLED || 'false' }}
    steps:
      - name: Check repository variables
        run: |
          set -euo pipefail
          failed=0
          check() {
            if [[ ! "$2" =~ $3 ]]; then
              echo "::error::Variable $1 is missing or malformed for $DEPLOY_ENV. Set it with the commands from 'terraform output github_variable_commands' in the $DEPLOY_ENV workspace (terraform/onboardai/README.md)."
              failed=1
            fi
          }
          check GCP_PROJECT_ID "$GCP_PROJECT_ID" '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
          check GCP_REGION "$GCP_REGION" '^[a-z]+-[a-z]+[0-9]+$'
          check GCP_WIF_PROVIDER "$GCP_WIF_PROVIDER" '^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$'
          check GCP_DEPLOYER_SA "$GCP_DEPLOYER_SA" "^onboardai-deployer${NAME_SUFFIX}@${GCP_PROJECT_ID}\.iam\.gserviceaccount\.com$"
          check AI_MODE "$AI_MODE" '^(demo|gemini|gemini-chat|document-search)$'
          check GEMINI_MODEL "$GEMINI_MODEL" '^[A-Za-z0-9._-]+$'
          check VERTEX_SEARCH_LOCATION "$VERTEX_SEARCH_LOCATION" '^(global|us|eu)$'
          check VERTEX_SEARCH_ENGINE_ID "$VERTEX_SEARCH_ENGINE_ID" '^[a-z0-9][a-z0-9_-]{0,62}$'
          check FIRESTORE_DATABASE_ID "$FIRESTORE_DATABASE_ID" '^(\(default\)|[a-z][a-z0-9-]{2,61}[a-z0-9])$'
          # Gemini text to speech on the api (#52); the checklist agent switch (#51).
          check VOICE_PROVIDER "$VOICE_PROVIDER" '^(gemini|kokoro)$'
          check GEMINI_TTS_MODEL "$GEMINI_TTS_MODEL" '^[A-Za-z0-9._-]+$'
          check GEMINI_TTS_LOCATION "$GEMINI_TTS_LOCATION" '^(global|[a-z]+-[a-z]+[0-9]+)$'
          check GEMINI_TTS_VOICE "$GEMINI_TTS_VOICE" '^[A-Za-z0-9_-]{0,64}$'
          check CHECKLIST_AGENT_ENABLED "$CHECKLIST_AGENT_ENABLED" '^(true|false)$'
          # Each stack names its own resources: a staging run only ones ending
          # in -staging, a production run none of those.
          for name in GCP_WIF_PROVIDER VERTEX_SEARCH_ENGINE_ID FIRESTORE_DATABASE_ID; do
            value=${!name}
            if [[ -n "$NAME_SUFFIX" && "$value" != *"$NAME_SUFFIX" ]] || [[ -z "$NAME_SUFFIX" && "$value" == *-staging ]]; then
              echo "::error::Variable $name names a resource of the wrong stack for this $DEPLOY_ENV deploy."
              failed=1
            fi
          done
          if [[ "$AI_MODE" =~ ^(gemini|gemini-chat)$ ]]; then
            echo "::notice::AI_MODE=$AI_MODE: the API calls Gemini on Vertex AI ($VERTEX_LOCATION) as onboardai-api-run$NAME_SUFFIX."
          else
            echo "::notice::AI_MODE=$AI_MODE: no Gemini calls (sample content or document search)."
          fi
          echo "::notice::VOICE_PROVIDER=$VOICE_PROVIDER: the api speaks with $GEMINI_TTS_MODEL on Vertex AI ($GEMINI_TTS_LOCATION) as onboardai-api-run$NAME_SUFFIX when it is gemini; tts is the Kokoro fallback."
          exit "$failed"

  images:
    name: Build and push (${{ matrix.service }})
    needs: [ci, config]
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        service: [web, api, tts]
    env:
      SERVICE: ${{ matrix.service }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      # The stack's repository is onboardai$NAME_SUFFIX under this registry.
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build before authenticating: the auth step writes a credentials file into
      # the workspace, and the workspace is the Docker build context.
      - name: Build image
        run: docker build --platform linux/amd64 --target "$SERVICE" -t "$REGISTRY/onboardai$NAME_SUFFIX/$SERVICE:$GITHUB_SHA" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$REGISTRY/onboardai$NAME_SUFFIX/$SERVICE:$GITHUB_SHA"

  # Creates or updates the employee form intake agent on Vertex AI Agent Engine
  # with the backend's deploy command (idempotent by display name) and hands
  # its resource name to the deploy job (INTAKE_AGENT_ENGINE). Only on staging
  # (#30), and only when the commit has the deploy command (package.json
  # script intake-agent:deploy, #27). Otherwise every step after the decision
  # is skipped with a notice, the job succeeds with deployed=false and no
  # engine, and the api deploys without the agent. Runs after every image is
  # pushed, so nothing changes unless CI passed and all three images built.
  agent:
    name: Deploy the intake agent
    needs: images
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    outputs:
      deployed: ${{ steps.decide.outputs.deploy }}
      engine: ${{ steps.agent.outputs.engine }}
    steps:
      # Into a subdirectory: the auth step writes its credentials file into the
      # workspace root, outside the tree the deploy command packages.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Decide whether the intake agent deploys
        id: decide
        working-directory: repo
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/staging ]]; then
            echo "::notice title=Intake agent skipped::The intake agent runs on staging only (#30); $DEPLOY_ENV deploys without it."
            deploy=false
          elif [[ -z "$(jq -r '.scripts["intake-agent:deploy"] // "" | strings' package.json)" ]]; then
            echo "::notice title=Intake agent skipped::package.json has no intake-agent:deploy script (#27 is not in this commit), so the api deploys without INTAKE_AGENT_ENGINE and INTAKE_MCP_TOKEN."
            deploy=false
          else
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up uv
        if: steps.decide.outputs.deploy == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.8
          enable-cache: false

      # The deploy script imports server modules (google-auth-library). No
      # install scripts run, and Google credentials do not exist yet.
      - name: Install dependencies
        if: steps.decide.outputs.deploy == 'true'
        working-directory: repo
        run: npm ci --omit=dev --ignore-scripts

      - name: Authenticate to Google Cloud
        if: steps.decide.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        if: steps.decide.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The agent runs as onboardai-intake$NAME_SUFFIX and reads INTAKE_MCP_TOKEN
      # from Secret Manager itself: only the secret's ID passes through here.
      # The command's last stdout line is the reasoning engine resource name.
      - name: Deploy the intake agent
        id: agent
        if: steps.decide.outputs.deploy == 'true'
        working-directory: repo
        run: |
          set -euo pipefail
          api_url=$(gcloud run services describe "onboardai-api$NAME_SUFFIX" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')
          if [[ ! "$api_url" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::onboardai-api$NAME_SUFFIX returned no usable URL for the agent's MCP endpoint."
            exit 1
          fi
          log="$RUNNER_TEMP/intake-agent-deploy.log"
          npm run --silent intake-agent:deploy -- \
            --project "$GCP_PROJECT_ID" \
            --location "$INTAKE_AGENT_LOCATION" \
            --display-name "OnboardAi employee form intake ($DEPLOY_ENV)" \
            --service-account "onboardai-intake$NAME_SUFFIX@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --mcp-url "$api_url/mcp" \
            --mcp-token-secret "onboardai-intake-mcp-token$NAME_SUFFIX" \
            --model "$GEMINI_MODEL" \
            --gemini-location "$VERTEX_LOCATION" | tee "$log"
          engine=$(tail -n 1 "$log")
          if [[ ! "$engine" =~ ^projects/[a-z0-9-]+/locations/${INTAKE_AGENT_LOCATION}/reasoningEngines/[0-9]+$ ]]; then
            echo "::error::The deploy command's last line is not a reasoning engine in $INTAKE_AGENT_LOCATION."
            exit 1
          fi
          echo "Intake agent: $engine"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  # Creates or updates the onboarding checklist agent on Vertex AI Agent Engine
  # (#51) with the backend's deploy command (idempotent by display name) and
  # hands its resource name to the deploy job (CHECKLIST_AGENT_ENGINE). Same
  # shape as the intake agent job above, in the same Agent Engine region
  # (INTAKE_AGENT_LOCATION). It deploys on staging, and on production only
  # when the repository variable CHECKLIST_AGENT_ENABLED is true (set it on the
  # production environment after var.checklist_agent_production, true by
  # default since #81, is applied), and
  # only when the commit has the deploy command (package.json script
  # checklist-agent:deploy). Otherwise every step after the decision is
  # skipped with a notice, the job succeeds with deployed=false and no engine,
  # and the api deploys without the agent.
  checklist_agent:
    name: Deploy the checklist agent
    needs: images
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
      CHECKLIST_AGENT_ENABLED: ${{ vars.CHECKLIST_AGENT_ENABLED }}
    outputs:
      deployed: ${{ steps.decide.outputs.deploy }}
      engine: ${{ steps.agent.outputs.engine }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo

      - name: Decide whether the checklist agent deploys
        id: decide
        working-directory: repo
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/staging && "$CHECKLIST_AGENT_ENABLED" != true ]]; then
            echo "::notice title=Checklist agent skipped::The checklist agent is off on $DEPLOY_ENV until the repository variable CHECKLIST_AGENT_ENABLED is true; $DEPLOY_ENV deploys without it."
            deploy=false
          elif [[ -z "$(jq -r '.scripts["checklist-agent:deploy"] // "" | strings' package.json)" ]]; then
            echo "::notice title=Checklist agent skipped::package.json has no checklist-agent:deploy script (#51 is not in this commit), so the api deploys without CHECKLIST_AGENT_ENGINE."
            deploy=false
          else
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Set up uv
        if: steps.decide.outputs.deploy == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.8
          enable-cache: false

      # No install scripts run, and Google credentials do not exist yet.
      - name: Install dependencies
        if: steps.decide.outputs.deploy == 'true'
        working-directory: repo
        run: npm ci --omit=dev --ignore-scripts

      - name: Authenticate to Google Cloud
        if: steps.decide.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        if: steps.decide.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The agent runs as onboardai-checklist$NAME_SUFFIX and reads and writes
      # Firestore itself. The command's last stdout line is the reasoning
      # engine resource name.
      - name: Deploy the checklist agent
        id: agent
        if: steps.decide.outputs.deploy == 'true'
        working-directory: repo
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/checklist-agent-deploy.log"
          npm run --silent checklist-agent:deploy -- \
            --project "$GCP_PROJECT_ID" \
            --location "$INTAKE_AGENT_LOCATION" \
            --display-name "OnboardAi onboarding checklist ($DEPLOY_ENV)" \
            --service-account "onboardai-checklist$NAME_SUFFIX@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            --firestore-database "$FIRESTORE_DATABASE_ID" | tee "$log"
          engine=$(tail -n 1 "$log")
          if [[ ! "$engine" =~ ^projects/[a-z0-9-]+/locations/${INTAKE_AGENT_LOCATION}/reasoningEngines/[0-9]+$ ]]; then
            echo "::error::The deploy command's last line is not a reasoning engine in $INTAKE_AGENT_LOCATION."
            exit 1
          fi
          echo "Checklist agent: $engine"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy tts, api, web
    needs: [images, agent, checklist_agent]
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    # The migration job may take two attempts of 600 s each (Terraform:
    # timeout, max_retries = 1), plus up to about 15 minutes for the job's
    # start, the log read and the three service deploys (tts alone may spend
    # 240 s in its startup probe).
    timeout-minutes: 45
    permissions:
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      # The stack's repository is onboardai$NAME_SUFFIX under this registry.
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}
      AI_MODE: ${{ vars.AI_MODE }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      VERTEX_SEARCH_LOCATION: ${{ vars.VERTEX_SEARCH_LOCATION }}
      VERTEX_SEARCH_ENGINE_ID: ${{ vars.VERTEX_SEARCH_ENGINE_ID }}
      FIRESTORE_DATABASE_ID: ${{ vars.FIRESTORE_DATABASE_ID }}
      # The agent job's result (#30): deployed is true only when it created or
      # updated the intake agent (staging, with #27's deploy command), and the
      # engine is then its reasoning engine. false and empty otherwise.
      INTAKE_AGENT_DEPLOYED: ${{ needs.agent.outputs.deployed }}
      INTAKE_AGENT_ENGINE: ${{ needs.agent.outputs.engine }}
      # The checklist agent job's result (#51), the same way.
      CHECKLIST_AGENT_DEPLOYED: ${{ needs.checklist_agent.outputs.deployed }}
      CHECKLIST_AGENT_ENGINE: ${{ needs.checklist_agent.outputs.engine }}
      # Gemini text to speech on the api (#52); defaults when the variable is unset.
      VOICE_PROVIDER: ${{ vars.VOICE_PROVIDER || 'gemini' }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
      GEMINI_TTS_LOCATION: ${{ vars.GEMINI_TTS_LOCATION || 'global' }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
      # Must equal output cloud_run_deploy_flags of terraform/onboardai; its
      # terraform test fails otherwise, so a deploy never undoes an apply or the
      # other way round. Image, env vars and traffic belong to this
      # workflow; Terraform ignores them.
      WEB_RUN_FLAGS: --cpu=1 --memory=512Mi --concurrency=80 --min-instances=0 --max-instances=3 --timeout=300 --port=8080 --execution-environment=gen2 --ingress=all --cpu-throttling --no-cpu-boost --startup-probe=httpGet.path=/web-health,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=12
      API_RUN_FLAGS: --cpu=1 --memory=1Gi --concurrency=80 --min-instances=0 --max-instances=1 --timeout=300 --port=8080 --execution-environment=gen2 --ingress=all --cpu-throttling --cpu-boost --startup-probe=httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=12
      TTS_RUN_FLAGS: --cpu=2 --memory=2Gi --concurrency=8 --min-instances=0 --max-instances=2 --timeout=300 --port=8080 --execution-environment=gen2 --ingress=all --cpu-throttling --cpu-boost --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,periodSeconds=5,timeoutSeconds=3,failureThreshold=48
    outputs:
      # The smoke job names no environment; it prints rollback commands with these.
      project_id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      # and gets the deployer's ID token for the api with these (#57).
      wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
      deployer_sa: ${{ vars.GCP_DEPLOYER_SA }}
      web_url: ${{ steps.deploy.outputs.web_url }}
      api_url: ${{ steps.deploy.outputs.api_url }}
      tts_url: ${{ steps.deploy.outputs.tts_url }}
      previous_web: ${{ steps.previous.outputs.web }}
      previous_api: ${{ steps.previous.outputs.api }}
      previous_tts: ${{ steps.previous.outputs.tts }}
      # true when the api was deployed with the intake agent (smoke test).
      intake_agent: ${{ steps.deploy.outputs.intake_agent }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Record the revisions serving now (rollback targets)
        id: previous
        run: |
          set -euo pipefail
          for key in web api tts; do
            name="onboardai-$key$NAME_SUFFIX"
            if ! rev=$(gcloud run services describe "$name" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.traffic[0].revisionName)'); then
              echo "::error::Cannot read $name. Apply terraform/onboardai ($DEPLOY_ENV) first; it creates the three services."
              exit 1
            fi
            echo "$name serves ${rev:-nothing yet}"
            echo "$key=$rev" >> "$GITHUB_OUTPUT"
          done

      # Every deploy, production and staging (#45). The Cloud Run job runs
      # `npm run db:migrate` from the api image this run deploys, as
      # onboardai-api-run$NAME_SUFFIX: the pending files of server/migrations
      # against Cloud SQL (Cloud SQL connection, DATABASE_URL from Secret
      # Manager), then those of server/migrations/firestore against the stack's
      # Firestore database (MIGRATION_TARGETS=sql,firestore, set by Terraform).
      # Each file runs once per database, so a re-run applies nothing. No
      # database value reaches this runner. It finishes before any service is
      # deployed, so a new revision never serves an unmigrated database; if it
      # fails, nothing is deployed.
      #
      # The job's output goes to Cloud Logging. Afterwards this step reads the
      # execution's lines through the log view onboardai-db-migrate$NAME_SUFFIX
      # (Terraform; it shows the deployer that job's log entries only) and
      # prints the runner's lines and nothing else: [sql] ..., [firestore] ...,
      # "Migrations finished: ..." or "Migration stopped: ...". Lines reach
      # Cloud Logging a few seconds late, so it retries for about 40 s; an
      # incomplete log never fails a successful migration.
      #
      # It first reads the job (#54). Terraform creates the job and the
      # deployer's access to it; before that apply, `gcloud run jobs update`
      # would stop with a bare PERMISSION_DENIED on run.jobs.get "(or resource
      # may not exist)". This names the missing apply instead.
      - name: Migrate the databases
        id: migrate
        run: |
          set -euo pipefail
          job="onboardai-db-migrate$NAME_SUFFIX"
          view="onboardai-db-migrate$NAME_SUFFIX"
          if ! gcloud run jobs describe "$job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(metadata.name)' > /dev/null 2> "$RUNNER_TEMP/migrate-describe.log"; then
            echo "::error::Cannot read the migration job $job. Apply terraform/onboardai ($DEPLOY_ENV) first; it creates the job and the deployer's access to it. Nothing was deployed."
            echo "gcloud: $(grep -m 1 '^ERROR' "$RUNNER_TEMP/migrate-describe.log" || head -n 1 "$RUNNER_TEMP/migrate-describe.log")"
            exit 1
          fi
          gcloud run jobs update "$job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --image="$REGISTRY/onboardai$NAME_SUFFIX/api:$GITHUB_SHA" --quiet
          since=$(date -u -d '-5 minutes' +%Y-%m-%dT%H:%M:%SZ)
          progress="$RUNNER_TEMP/migrate-execute.log"
          status=0
          execution=$(gcloud run jobs execute "$job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --wait --quiet --format='value(metadata.name)' 2> "$progress") || status=$?
          cat "$progress" >&2
          # A failed execution prints no result, but gcloud names it on stderr.
          if [[ -z "$execution" ]]; then
            execution=$(grep -oE "executions describe $job-[a-z0-9]+\$" "$progress" | tail -n 1 | cut -d ' ' -f 3) || execution=""
          fi
          [[ "$execution" =~ ^$job-[a-z0-9]+$ ]] || execution=""
          echo "execution=$execution" >> "$GITHUB_OUTPUT"

          # The runner's lines only, in order; a retried task's lines are marked.
          # (A jq program: $try is jq's variable, not the shell's.)
          # shellcheck disable=SC2016
          select='.[] | select(.textPayload != null) | (.labels["run.googleapis.com/task_attempt"] // "0") as $try | .textPayload | split("\n")[] | select(test("^(\\[sql\\] |\\[firestore\\] |Migrations finished|Migration stopped)")) | if $try == "0" then . else "(retry \($try)) \(.)" end'
          if ((status == 0)); then last='Migrations finished'; else last='Migration stopped'; fi
          lines=""
          complete=false
          missing="(none found in Cloud Logging)"
          if [[ -n "$execution" ]]; then
            filter="labels.\"run.googleapis.com/execution_name\"=\"$execution\" AND timestamp>=\"$since\""
            for attempt in 1 2 3 4 5 6 7 8; do
              if ! entries=$(gcloud logging read "$filter" --project="$GCP_PROJECT_ID" --bucket=_Default --location=global --view="$view" --order=asc --limit=1000 --format=json 2> "$RUNNER_TEMP/logging-read.log"); then
                echo "::warning::Could not read the migration log through log view $view: $(head -n 1 "$RUNNER_TEMP/logging-read.log")"
                missing="(Cloud Logging could not be read)"
                complete=unreadable
                break
              fi
              lines=$(jq -r "$select" <<< "$entries")
              if grep -qE "^(\\(retry [0-9]+\\) )?$last" <<< "$lines"; then
                complete=true
                break
              fi
              if ((attempt < 8)); then sleep 5; fi
            done
          fi

          echo "Migration lines of execution ${execution:-(unknown)} (Cloud Run job $job, api image $GITHUB_SHA):"
          printf '%s\n' "${lines:-$missing}"
          {
            echo "### Database migrations ($DEPLOY_ENV)"
            echo "Cloud Run job $job, execution ${execution:-(unknown)}, api image $GITHUB_SHA:"
            echo '```text'
            printf '%s\n' "${lines:-$missing}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ((status != 0)); then
            echo "::error::The database migration failed, so nothing was deployed: every service still serves its previous revision. The full log is in Cloud Logging (Cloud Run job $job, execution ${execution:-(unknown)})."
            exit 1
          fi
          if [[ "$complete" == false ]]; then
            echo "::warning::The migration succeeded, but its last line had not reached Cloud Logging yet; read the full log in Cloud Logging (log view $view, execution ${execution:-(unknown)})."
          fi

      # Points the document reconciliation job (#79) at the api image this run
      # deploys, so it reconciles with the same code the api runs. It never
      # executes the job: the Cloud Scheduler job starts it every hour. Terraform
      # creates the job, so a deploy that merges before the apply skips this step
      # with a notice. A job the deployer cannot read looks the same as a missing
      # one to Cloud Run (403 "or resource may not exist"), so both skip; any
      # other error is a warning and does not stop the deploy, because the job
      # then keeps the image it had.
      - name: Update the document reconciliation job
        run: |
          set -euo pipefail
          job="onboardai-docs-reconcile$NAME_SUFFIX"
          log="$RUNNER_TEMP/reconcile-job.log"
          if ! gcloud run jobs describe "$job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(metadata.name)' > /dev/null 2> "$log"; then
            first=$(grep -m 1 '^ERROR' "$log" || head -n 1 "$log")
            if grep -qiE 'could not be found|not found|may not exist|run\.jobs\.get' "$log"; then
              echo "::notice title=Reconcile job skipped::Cloud Run job $job does not exist yet (or the deployer cannot read it), so its image was not updated. Apply terraform/onboardai ($DEPLOY_ENV) to create it; the next deploy updates it."
            else
              echo "::warning title=Reconcile job not updated::Could not read Cloud Run job $job, so its image was not updated: $first"
            fi
            exit 0
          fi
          if ! gcloud run jobs update "$job" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --image="$REGISTRY/onboardai$NAME_SUFFIX/api:$GITHUB_SHA" --quiet 2> "$log"; then
            echo "::warning title=Reconcile job not updated::gcloud run jobs update $job failed; it keeps its previous image: $(grep -m 1 '^ERROR' "$log" || head -n 1 "$log")"
            exit 0
          fi
          echo "Cloud Run job $job now runs the api image $GITHUB_SHA."

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          # deploy KEY "ENV_VARS" [extra gcloud flags...]; sets DEPLOYED_URL.
          deploy() {
            local key=$1 env_vars=$2 name="onboardai-$1$NAME_SUFFIX" flags_var url
            shift 2
            flags_var="${key^^}_RUN_FLAGS"
            local -a flags
            read -r -a flags <<< "${!flags_var}"
            echo "::group::Deploy $name"
            gcloud run deploy "$name" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --image="$REGISTRY/onboardai$NAME_SUFFIX/$key:$GITHUB_SHA" \
              --service-account="onboardai-$key-run$NAME_SUFFIX@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
              --set-env-vars="$env_vars" \
              "${flags[@]}" "$@" \
              --quiet
            # A manual rollback pins traffic to an old revision. Send it to the new one.
            gcloud run services update-traffic "$name" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --to-latest --quiet
            url=$(gcloud run services describe "$name" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')
            if [[ ! "$url" =~ ^https://[a-z0-9.-]+$ ]]; then
              echo "::error::$name returned no usable URL."
              exit 1
            fi
            echo "${key}_url=$url" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            DEPLOYED_URL=$url
          }

          deploy tts "NODE_ENV=production"
          tts_url=$DEPLOYED_URL

          # Gemini, Vertex AI Search and Firestore all use the service's own
          # identity (ADC as onboardai-api-run$NAME_SUFFIX): there is no API key.
          # --set-env-vars replaces the whole set, so variables an earlier
          # revision carried and this list lacks are dropped.
          api_env="NODE_ENV=production,AI_MODE=$AI_MODE,GEMINI_MODEL=$GEMINI_MODEL,GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID,GOOGLE_CLOUD_LOCATION=$VERTEX_LOCATION,VERTEX_SEARCH_LOCATION=$VERTEX_SEARCH_LOCATION,VERTEX_SEARCH_ENGINE_ID=$VERTEX_SEARCH_ENGINE_ID,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,DOCS_BUCKET=$GCP_PROJECT_ID-onboardai-docs$NAME_SUFFIX,VERTEX_SEARCH_DATA_STORE_ID=onboardai-docs$NAME_SUFFIX,EMPLOYEE_DOCUMENTS_BUCKET=$GCP_PROJECT_ID-onboardai-employee-docs$NAME_SUFFIX,TTS_SERVICE_URL=$tts_url"
          # Labels the api's company-document sync log lines (#79): staging or
          # production. Anything else reads as local.
          api_env+=",ONBOARDAI_ENVIRONMENT=$DEPLOY_ENV"
          # Voice (#52): the api calls Gemini TTS as its own identity; the
          # voice is passed only when set (the backend has a default).
          api_env+=",VOICE_PROVIDER=$VOICE_PROVIDER,GEMINI_TTS_MODEL=$GEMINI_TTS_MODEL,GEMINI_TTS_LOCATION=$GEMINI_TTS_LOCATION"
          if [[ -n "$GEMINI_TTS_VOICE" ]]; then
            api_env+=",GEMINI_TTS_VOICE=$GEMINI_TTS_VOICE"
          fi
          # The checklist agent (#51), when its job deployed it.
          if [[ "$CHECKLIST_AGENT_DEPLOYED" == true ]]; then
            if [[ ! "$CHECKLIST_AGENT_ENGINE" =~ ^projects/[a-z0-9-]+/locations/[a-z0-9-]+/reasoningEngines/[0-9]+$ ]]; then
              echo "::error::The checklist_agent job deployed the checklist agent but returned no reasoning engine resource name."
              exit 1
            fi
            api_env+=",CHECKLIST_AGENT_ENGINE=$CHECKLIST_AGENT_ENGINE"
          fi
          # Employee accounts, every stack (#45): the Cloud SQL connection (Unix
          # socket /cloudsql/<connection name>) and DATABASE_URL as a Secret
          # Manager reference, which Cloud Run reads as
          # onboardai-api-run$NAME_SUFFIX: the value never passes through this
          # runner. --set-secrets replaces every reference an earlier revision
          # carried (production's retired GEMINI_API_KEY mount included).
          api_secrets="DATABASE_URL=onboardai-database-url$NAME_SUFFIX:latest"
          # The intake agent (staging only, #30), when the agent job deployed it:
          # its engine and INTAKE_MCP_TOKEN, also a Secret Manager reference.
          if [[ "$DEPLOY_ENV" == staging && "$INTAKE_AGENT_DEPLOYED" == true ]]; then
            if [[ ! "$INTAKE_AGENT_ENGINE" =~ ^projects/[a-z0-9-]+/locations/[a-z0-9-]+/reasoningEngines/[0-9]+$ ]]; then
              echo "::error::The agent job deployed the intake agent but returned no reasoning engine resource name."
              exit 1
            fi
            api_env+=",INTAKE_AGENT_ENGINE=$INTAKE_AGENT_ENGINE"
            api_secrets+=",INTAKE_MCP_TOKEN=onboardai-intake-mcp-token$NAME_SUFFIX:latest"
            echo "intake_agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "intake_agent=false" >> "$GITHUB_OUTPUT"
          fi
          deploy api "$api_env" \
            --set-cloudsql-instances="$GCP_PROJECT_ID:$GCP_REGION:onboardai-db$NAME_SUFFIX" \
            --set-secrets="$api_secrets"
          api_url=$DEPLOYED_URL

          deploy web "NODE_ENV=production,API_SERVICE_URL=$api_url"

      - name: Print rollback commands
        if: failure()
        env:
          PREVIOUS_WEB: ${{ steps.previous.outputs.web }}
          PREVIOUS_API: ${{ steps.previous.outputs.api }}
          PREVIOUS_TTS: ${{ steps.previous.outputs.tts }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
        run: |
          {
            echo "### Deploy of $GITHUB_SHA to $DEPLOY_ENV failed"
            if [[ "$MIGRATE_OUTCOME" == failure ]]; then
              echo "The database migration failed, so no service was deployed: all three still serve the revisions they served before this run, and there is nothing to roll back. A failed SQL file rolled back its own transaction; files applied before it stay applied (migrations are forward-only). Fix forward: push a commit that corrects or adds a migration."
            elif [[ "$MIGRATE_OUTCOME" != success ]]; then
              echo "The run stopped before the migration: nothing was migrated or deployed."
            else
              echo "A revision that failed to start receives no traffic. To put all three services back on the revisions that served before this run:"
              echo '```sh'
              for pair in "web=$PREVIOUS_WEB" "api=$PREVIOUS_API" "tts=$PREVIOUS_TTS"; do
                if [[ -n "${pair#*=}" ]]; then
                  echo "gcloud run services update-traffic onboardai-${pair%%=*}$NAME_SUFFIX --project=$GCP_PROJECT_ID --region=$GCP_REGION --to-revisions=${pair#*=}=100"
                fi
              done
              echo '```'
              echo "This run's migrations stay applied after a service rollback, so the previous revisions run against the migrated databases. To undo a migration, ship a new one, or restore the database (terraform/onboardai/README.md, Roll back a migration)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Checks the stack from outside, through web like a browser. Since #57 the api
  # and tts are private (Cloud Run IAM, terraform/onboardai) and web reaches
  # them with ID tokens, so web is the way in; every check through web passes
  # whether or not that IAM is applied yet (the app is deployed first). The api
  # and tts URLs themselves are only reported, as public or private.
  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only for the deployer's ID token of the POST /mcp check (staging, when
    # this run deployed the intake agent); no other step authenticates.
    permissions:
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ needs.deploy.outputs.project_id }}
      GCP_REGION: ${{ needs.deploy.outputs.region }}
      WEB_URL: ${{ needs.deploy.outputs.web_url }}
      API_URL: ${{ needs.deploy.outputs.api_url }}
      TTS_URL: ${{ needs.deploy.outputs.tts_url }}
      INTAKE_AGENT: ${{ needs.deploy.outputs.intake_agent }}
    steps:
      - name: Check the deployed services
        run: |
          set -euo pipefail
          # probe LABEL URL ATTEMPTS RETRY_CODES [CURL_ARGS...]: wants HTTP 200;
          # retries 10 s apart while the answer matches RETRY_CODES.
          probe() {
            local label=$1 url=$2 attempts=$3 retry=$4 code=000 i
            shift 4
            for ((i = 1; i <= attempts; i++)); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$@" "$url") || code=000
              if [[ "$code" == 200 ]]; then
                echo "ok   $label -> 200"
                return 0
              fi
              [[ "$code" =~ ^($retry)$ ]] || break
              echo "wait $label -> $code (attempt $i of $attempts)"
              sleep 10
            done
            echo "::error::$label -> HTTP $code ($url)"
            return 1
          }
          # probe_json LABEL URL ATTEMPTS RETRY_CODES WANT_CODE JQ_TEST [CURL_ARGS...]:
          # like probe, but wants HTTP WANT_CODE and a JSON body for which the jq
          # test is true. A Cloud Run page (HTML 401 or 403) fails the jq test, so
          # only an answer from the api itself passes.
          probe_json() {
            local label=$1 url=$2 attempts=$3 retry=$4 want=$5 test=$6 code=000 body i
            shift 6
            body="$RUNNER_TEMP/probe-json.out"
            for ((i = 1; i <= attempts; i++)); do
              : > "$body"
              code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 "$@" "$url") || code=000
              if [[ "$code" == "$want" ]] && jq -e "$test" > /dev/null 2>&1 < "$body"; then
                echo "ok   $label -> $code"
                return 0
              fi
              [[ "$code" =~ ^($retry)$ ]] || break
              echo "wait $label -> $code (attempt $i of $attempts)"
              sleep 10
            done
            echo "::error::$label -> HTTP $code, expected HTTP $want with a JSON body matching: $test ($url)"
            return 1
          }
          # reach NAME URL: reports whether URL answers without an ID token, and
          # never fails: 200 (public) until terraform/onboardai ($DEPLOY_ENV) has
          # #57's IAM, 403 (private) after it.
          reach() {
            local name=$1 url=$2 code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url") || code=000
            case "$code" in
              403) echo "::notice title=$name is private::GET $url answers 403 without an ID token (Cloud Run IAM)." ;;
              200) echo "::notice title=$name is public::GET $url answers 200 without an ID token. Apply terraform/onboardai ($DEPLOY_ENV) to make it private (#57)." ;;
              *) echo "::notice title=$name::GET $url answers HTTP $code without an ID token." ;;
            esac
          }
          for url in "$WEB_URL" "$API_URL" "$TTS_URL"; do
            if [[ ! "$url" =~ ^https:// ]]; then
              echo "::error::A service URL is missing from the deploy job's outputs."
              exit 1
            fi
          done
          failed=0
          probe "web GET /web-health" "$WEB_URL/web-health" 6 '5[0-9][0-9]|000' || failed=1
          probe "web GET / (frontend)" "$WEB_URL/" 6 '5[0-9][0-9]|000' || failed=1
          # web -> api, with web's ID token for the api.
          probe "web GET /api/health (proxied to api)" "$WEB_URL/api/health" 6 '5[0-9][0-9]|000' || failed=1
          # web -> api, signed out: /api/voice needs an account (#55), so the api
          # answers its own 401 AUTH_REQUIRED. Cloud Run's HTML 401 or 403 means
          # the ID token web sent was refused; that fails here.
          probe_json "web POST /api/voice signed out (api's own 401)" "$WEB_URL/api/voice" 6 '5[0-9][0-9]|000' 401 '.code == "AUTH_REQUIRED"' -X POST -H 'Content-Type: application/json' --data '{"text":"Hello.","rate":1}' || failed=1
          # web -> api -> tts, with both ID tokens, no sign-in (#67): the api makes
          # one ID-token call to tts. "local" (no remote tts) would hide a missing
          # TTS_SERVICE_URL on Cloud Run, so only "ok" passes. A cold tts loads
          # the model first (up to 240 s; the api waits 120 s, then answers 503),
          # so 5xx is retried.
          probe_json "web GET /api/health/tts (api -> tts)" "$WEB_URL/api/health/tts" 6 '5[0-9][0-9]|000' 200 '.ok == true and .tts == "ok"' --max-time 150 || failed=1
          reach "onboardai-api$NAME_SUFFIX" "$API_URL/api/health"
          reach "onboardai-tts$NAME_SUFFIX" "$TTS_URL/health"
          exit "$failed"

      # POST /mcp is the one direct call to the api (it is not under /api, so web
      # does not proxy it), and the api may be private. The request carries the
      # deployer's ID token for the api, whose Cloud Run Developer role on the
      # api includes run.routes.invoke. The token is masked in the log and no
      # credentials file is written.
      - name: Get an ID token for the api
        id: api-token
        if: needs.deploy.outputs.intake_agent == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ needs.deploy.outputs.wif_provider }}
          service_account: ${{ needs.deploy.outputs.deployer_sa }}
          token_format: id_token
          id_token_audience: ${{ needs.deploy.outputs.api_url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      # Every stack (#45): the api found its accounts database (DATABASE_URL
      # and the Cloud SQL connection reached it). Only when this run deployed
      # the intake agent (staging, #30): the api found the agent, and the MCP
      # endpoint refuses a caller without the token.
      - name: Check employee accounts and form import
        env:
          API_ID_TOKEN: ${{ steps.api-token.outputs.id_token }}
        run: |
          set -euo pipefail
          failed=0
          if ! config=$(curl -sS --fail --max-time 30 "$WEB_URL/api/config"); then
            echo "::error::GET /api/config through web failed."
            exit 1
          fi
          if jq -e '.accounts == true' > /dev/null <<< "$config"; then
            echo "ok   web GET /api/config -> accounts is on"
          else
            echo "::error::GET /api/config must report accounts: true (DATABASE_URL and the Cloud SQL connection reached the api)."
            failed=1
          fi
          if [[ "$INTAKE_AGENT" != true ]]; then
            echo "skip employeeImport and POST /mcp: this run did not deploy the intake agent"
            exit "$failed"
          fi
          if jq -e '.employeeImport == true' > /dev/null <<< "$config"; then
            echo "ok   web GET /api/config -> employeeImport is on"
          else
            echo "::error::GET /api/config must report employeeImport: true (INTAKE_AGENT_ENGINE and INTAKE_MCP_TOKEN reached the api)."
            failed=1
          fi
          if [[ -z "${API_ID_TOKEN:-}" ]]; then
            echo "::error::No ID token for the api; POST /mcp was not checked."
            exit 1
          fi
          # The ID token goes in X-Serverless-Authorization (Authorization is the
          # MCP token's, deliberately absent) and reaches curl on stdin, never on
          # its command line. The api itself must answer: 401 with its JSON-RPC
          # error, not Cloud Run's own 401 or 403 page.
          body="$RUNNER_TEMP/mcp.json"
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' -H @- --data '{}' "$API_URL/mcp" <<< "X-Serverless-Authorization: Bearer $API_ID_TOKEN") || code=000
          if [[ "$code" == 401 ]] && jq -e '.jsonrpc == "2.0" and .error.code == -32001' > /dev/null 2>&1 < "$body"; then
            echo "ok   api POST /mcp with the deployer's ID token, without the MCP token -> 401 from the api"
          else
            echo "::error::POST /mcp with an ID token but without the MCP token answered HTTP $code, expected the api's own 401 (a 403 or an HTML 401 is Cloud Run refusing the ID token)."
            failed=1
          fi
          exit "$failed"

      - name: Print rollback commands
        if: failure()
        env:
          PREVIOUS_WEB: ${{ needs.deploy.outputs.previous_web }}
          PREVIOUS_API: ${{ needs.deploy.outputs.previous_api }}
          PREVIOUS_TTS: ${{ needs.deploy.outputs.previous_tts }}
        run: |
          {
            echo "### Smoke test of $GITHUB_SHA on $DEPLOY_ENV failed"
            echo "The new revisions are serving. To put all three services back on the revisions that served before this run:"
            echo '```sh'
            for pair in "web=$PREVIOUS_WEB" "api=$PREVIOUS_API" "tts=$PREVIOUS_TTS"; do
              if [[ -n "${pair#*=}" ]]; then
                echo "gcloud run services update-traffic onboardai-${pair%%=*}$NAME_SUFFIX --project=$GCP_PROJECT_ID --region=$GCP_REGION --to-revisions=${pair#*=}=100"
              fi
            done
            echo '```'
            echo "This run's migrations stay applied after a service rollback, so the previous revisions run against the migrated databases. To undo a migration, ship a new one, or restore the database (terraform/onboardai/README.md, Roll back a migration)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
